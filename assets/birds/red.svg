<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="redBody" cx=".35" cy=".24" r=".92">
      <stop offset="0" stop-color="#ff8161"/>
      <stop offset=".48" stop-color="#ef4b2f"/>
      <stop offset=".83" stop-color="#d62b1d"/>
      <stop offset="1" stop-color="#b71c17"/>
    </radialGradient>
    <linearGradient id="redBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2cc"/>
      <stop offset="1" stop-color="#f5c98f"/>
    </linearGradient>
    <linearGradient id="beakTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd768"/>
      <stop offset="1" stop-color="#f7a825"/>
    </linearGradient>
    <linearGradient id="beakBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a11d"/>
      <stop offset="1" stop-color="#d87912"/>
    </linearGradient>
    <linearGradient id="eyeWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#f5ead7"/>
    </linearGradient>
  </defs>

  <g stroke="#2e1d17" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail feathers -->
    <path d="M67 128C39 108 20 105 8 113c14 15 25 30 25 46 16-5 31-3 49 0z" fill="#bc2118"/>
    <path d="M66 151c-23 8-34 22-30 36 20-7 39-6 56-1z" fill="#9f1915"/>

    <!-- head feathers -->
    <path d="M101 47C91 24 104 12 119 28c4-19 20-21 28 0 17-14 31 0 22 22z" fill="#d72c1f"/>

    <!-- chunky body -->
    <path d="M127 42c52 0 89 37 89 88 0 53-38 88-90 88-54 0-91-36-91-89 0-51 39-87 92-87Z" fill="url(#redBody)"/>

    <!-- soft belly -->
    <path d="M77 161c16-15 39-19 60-10 22 9 37 25 37 40 0 18-25 27-55 26-31-1-53-13-53-30 0-10 3-18 11-26Z" fill="url(#redBelly)" stroke="none" opacity=".98"/>

    <!-- cheek feathers -->
    <path d="M63 135c-8 7-11 17-8 26 8-4 15-9 21-16z" fill="#be231a" stroke="none"/>
    <path d="M190 130c9 8 11 18 7 26-8-4-15-9-20-17z" fill="#be231a" stroke="none"/>

    <!-- eyes -->
    <g>
      <ellipse cx="93" cy="105" rx="29" ry="36" transform="rotate(-7 93 105)" fill="url(#eyeWhite)"/>
      <ellipse cx="158" cy="103" rx="29" ry="36" transform="rotate(7 158 103)" fill="url(#eyeWhite)"/>
      <ellipse cx="103" cy="111" rx="9.5" ry="14" transform="rotate(-7 103 111)" fill="#211712" stroke="none"/>
      <ellipse cx="148" cy="109" rx="9.5" ry="14" transform="rotate(7 148 109)" fill="#211712" stroke="none"/>
      <circle cx="106" cy="106" r="3.4" fill="#fffdf4" stroke="none"/>
      <circle cx="151" cy="104" r="3.4" fill="#fffdf4" stroke="none"/>
    </g>

    <!-- heavy, unimpressed brows -->
    <path d="M56 70c19 2 39 10 56 21" fill="none" stroke="#241612" stroke-width="15"/>
    <path d="M197 66c-19 3-40 11-57 23" fill="none" stroke="#241612" stroke-width="15"/>

    <!-- beak -->
    <g>
      <path d="M117 127c18-4 45-1 60 9 8 6 7 11-2 14-14 5-40 8-57 3-7-2-8-8-6-15z" fill="url(#beakTop)"/>
      <path d="M117 150c16 4 36 11 48 20 6 5 4 10-3 13-13 5-32 2-44-5-7-4-7-10-8-18z" fill="url(#beakBottom)"/>
      <path d="M119 145c17 1 39 2 55 4" fill="none" stroke="#8a4513" stroke-width="3.5"/>
      <ellipse cx="143" cy="137" rx="3.2" ry="2.1" fill="#8d4b1b" stroke="none"/>
      <path d="M136 129c10 0 23 2 31 6" fill="none" stroke="#fff0ae" stroke-width="3" opacity=".42"/>
    </g>

    <!-- tuft chest line -->
    <path d="M76 185c12 9 25 13 41 14" fill="none" stroke="#d39a60" stroke-width="3" opacity=".45"/>
  </g>
</svg>
