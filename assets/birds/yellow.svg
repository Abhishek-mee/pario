<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="yellowBody" cx=".34" cy=".22" r=".95">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset=".45" stop-color="#ffdb3c"/>
      <stop offset=".82" stop-color="#f7b722"/>
      <stop offset="1" stop-color="#df9314"/>
    </radialGradient>
    <linearGradient id="yellowBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c1"/>
      <stop offset="1" stop-color="#f5d47f"/>
    </linearGradient>
    <linearGradient id="beakTopY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcc53"/>
      <stop offset="1" stop-color="#ed9220"/>
    </linearGradient>
    <linearGradient id="beakBottomY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9901d"/>
      <stop offset="1" stop-color="#c46911"/>
    </linearGradient>
    <linearGradient id="eyeWhiteY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#f6ead6"/>
    </linearGradient>
  </defs>

  <g stroke="#2e1d17" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- swept tail -->
    <path d="M72 132C45 111 23 107 9 113c13 17 24 33 23 49 16-6 32-3 51 1z" fill="#dda017"/>
    <path d="M73 157c-22 8-34 21-31 35 20-7 38-6 54 1z" fill="#bd7f0f"/>

    <!-- pointed head feathers -->
    <path d="M96 52C82 26 101 15 112 35c2-24 22-26 29-4 15-20 33-6 25 21z" fill="#f3bb1c"/>

    <!-- wedge-shaped body -->
    <path d="M129 38c39 5 68 39 76 82 9 50-21 94-78 98-58 4-95-33-95-85 0-46 35-89 97-95Z" fill="url(#yellowBody)"/>

    <!-- pale belly -->
    <path d="M74 166c18-15 42-18 63-8 21 10 34 26 33 41-1 17-27 25-55 23-30-2-51-15-50-32 0-10 3-17 9-24Z" fill="url(#yellowBelly)" stroke="none"/>

    <!-- feather texture -->
    <path d="M51 137c-8 9-10 19-6 29 8-3 15-8 20-16z" fill="#e9a917" stroke="none"/>
    <path d="M195 139c7 10 8 20 4 29-8-3-14-9-18-17z" fill="#e9a917" stroke="none"/>

    <!-- eyes -->
    <ellipse cx="94" cy="110" rx="27" ry="34" transform="rotate(-8 94 110)" fill="url(#eyeWhiteY)"/>
    <ellipse cx="157" cy="106" rx="27" ry="34" transform="rotate(9 157 106)" fill="url(#eyeWhiteY)"/>
    <ellipse cx="104" cy="116" rx="9" ry="13.5" transform="rotate(-8 104 116)" fill="#201612" stroke="none"/>
    <ellipse cx="147" cy="112" rx="9" ry="13.5" transform="rotate(9 147 112)" fill="#201612" stroke="none"/>
    <circle cx="107" cy="111" r="3.2" fill="#fffdf4" stroke="none"/>
    <circle cx="150" cy="107" r="3.2" fill="#fffdf4" stroke="none"/>

    <!-- brows -->
    <path d="M55 76c18 3 39 12 55 23" fill="none" stroke="#281a11" stroke-width="15"/>
    <path d="M198 69c-18 4-40 13-57 26" fill="none" stroke="#281a11" stroke-width="15"/>

    <!-- beak -->
    <path d="M115 131c18-5 45-2 61 8 8 6 7 11-2 14-14 5-41 8-58 3-7-2-8-8-6-15z" fill="url(#beakTopY)"/>
    <path d="M115 153c16 5 36 12 48 21 6 5 4 10-3 13-13 5-31 2-43-5-7-4-8-11-9-19z" fill="url(#beakBottomY)"/>
    <path d="M117 149c17 1 39 2 55 4" fill="none" stroke="#8a4b10" stroke-width="3.5"/>
    <ellipse cx="141" cy="140" rx="3.2" ry="2" fill="#8a4b10" stroke="none"/>
    <path d="M136 134c10 0 22 2 30 6" fill="none" stroke="#fff2a4" stroke-width="3" opacity=".45"/>

    <!-- speed lines across the chest -->
    <path d="M82 191c14 5 27 7 42 6" fill="none" stroke="#d29823" stroke-width="3" opacity=".45"/>
    <path d="M92 202c12 3 22 4 34 3" fill="none" stroke="#d29823" stroke-width="3" opacity=".32"/>
  </g>
</svg>
