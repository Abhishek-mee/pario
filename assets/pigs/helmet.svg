<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="pigHelmetBody" cx=".34" cy=".25" r=".92">
      <stop offset="0" stop-color="#c9ef6a"/>
      <stop offset=".48" stop-color="#94d33f"/>
      <stop offset=".84" stop-color="#6bb52c"/>
      <stop offset="1" stop-color="#558f23"/>
    </radialGradient>
    <linearGradient id="snoutHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde85e"/>
      <stop offset="1" stop-color="#7dbc37"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#edf3ec"/>
      <stop offset=".24" stop-color="#b7c3c0"/>
      <stop offset=".55" stop-color="#84928e"/>
      <stop offset=".8" stop-color="#65716f"/>
      <stop offset="1" stop-color="#9aa6a2"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd8d2"/>
      <stop offset=".5" stop-color="#7f8c88"/>
      <stop offset="1" stop-color="#505b58"/>
    </linearGradient>
  </defs>

  <g stroke="#2b2918" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- feet -->
    <path d="M74 201c-3 15 3 23 19 24 14 1 21-7 21-22z" fill="#70ae32"/>
    <path d="M166 201c3 15-3 23-19 24-14 1-21-7-21-22z" fill="#70ae32"/>

    <!-- ears behind helmet -->
    <path d="M65 88C47 64 51 42 71 49c13 5 21 15 25 27z" fill="#8ccb3d"/>
    <path d="M175 88c18-24 14-46-6-39-13 5-21 15-25 27z" fill="#8ccb3d"/>

    <!-- body -->
    <ellipse cx="120" cy="139" rx="91" ry="84" fill="url(#pigHelmetBody)"/>
    <ellipse cx="120" cy="168" rx="58" ry="40" fill="#c0e662" opacity=".17" stroke="none"/>

    <!-- chin strap -->
    <path d="M51 112c-5 42 18 76 69 78 52 2 74-33 69-76" fill="none" stroke="#3b3830" stroke-width="6" opacity=".78"/>

    <!-- eyes -->
    <ellipse cx="86" cy="118" rx="19" ry="21" fill="#fffdf2"/>
    <ellipse cx="154" cy="118" rx="19" ry="21" fill="#fffdf2"/>
    <ellipse cx="91" cy="120" rx="7" ry="10" fill="#242013" stroke="none"/>
    <ellipse cx="149" cy="120" rx="7" ry="10" fill="#242013" stroke="none"/>
    <circle cx="94" cy="116" r="2.7" fill="#fffdf4" stroke="none"/>
    <circle cx="152" cy="116" r="2.7" fill="#fffdf4" stroke="none"/>
    <path d="M65 99c11-6 25-4 35 2" fill="none" stroke="#4d7620" stroke-width="5"/>
    <path d="M175 99c-11-6-25-4-35 2" fill="none" stroke="#4d7620" stroke-width="5"/>

    <!-- cheeks and snout -->
    <ellipse cx="54" cy="151" rx="14" ry="8" fill="#f18a6a" opacity=".34" stroke="none"/>
    <ellipse cx="186" cy="151" rx="14" ry="8" fill="#f18a6a" opacity=".34" stroke="none"/>
    <ellipse cx="120" cy="153" rx="43" ry="30" fill="url(#snoutHelmet)"/>
    <ellipse cx="105" cy="153" rx="5.5" ry="7.5" fill="#557a21" stroke="none"/>
    <ellipse cx="135" cy="153" rx="5.5" ry="7.5" fill="#557a21" stroke="none"/>
    <path d="M108 168c8 4 17 4 24 0" fill="none" stroke="#557a21" stroke-width="4"/>

    <!-- worried little mouth -->
    <path d="M94 187c14 7 38 6 52-2" fill="none" stroke="#4b6d20" stroke-width="5"/>
    <path d="M100 192c9 5 29 5 39 0" fill="none" stroke="#b3d96a" stroke-width="3" opacity=".6"/>

    <!-- helmet dome -->
    <path d="M50 92C48 50 76 26 120 26s72 24 70 66z" fill="url(#metal)"/>
    <path d="M120 27c-8 18-10 43-8 65" fill="none" stroke="#f3f7ef" stroke-width="5" opacity=".6"/>
    <path d="M53 70c22-26 44-37 67-39" fill="none" stroke="#f7faf4" stroke-width="6" opacity=".5"/>
    <path d="M177 60c-13-17-30-27-47-31" fill="none" stroke="#4f5c58" stroke-width="5" opacity=".35"/>

    <!-- helmet rim -->
    <rect x="42" y="82" width="156" height="21" rx="10.5" fill="url(#metalRim)"/>
    <path d="M53 88h134" fill="none" stroke="#e8eee8" stroke-width="3.5" opacity=".48"/>

    <!-- rivets -->
    <circle cx="60" cy="93" r="4" fill="#3f4a47"/>
    <circle cx="180" cy="93" r="4" fill="#3f4a47"/>
    <circle cx="120" cy="93" r="4.5" fill="#3f4a47"/>
    <circle cx="65" cy="90" r="1.4" fill="#f4f7f2" stroke="none"/>
    <circle cx="125" cy="90" r="1.4" fill="#f4f7f2" stroke="none"/>

    <!-- helmet dent -->
    <path d="M146 46c6 3 10 7 12 13" fill="none" stroke="#5e6a66" stroke-width="3" opacity=".5"/>

    <!-- star badge -->
    <path d="M120 55l4.5 9.5 10.5 1.4-7.7 7.3 1.9 10.3-9.2-5-9.2 5 1.9-10.3-7.7-7.3 10.5-1.4z" fill="#f2c542" stroke="#5c4c20" stroke-width="2.5"/>
  </g>
</svg>
