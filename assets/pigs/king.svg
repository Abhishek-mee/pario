<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="pigKingBody" cx=".34" cy=".25" r=".92">
      <stop offset="0" stop-color="#c6e96d"/>
      <stop offset=".46" stop-color="#91cd43"/>
      <stop offset=".84" stop-color="#6cad32"/>
      <stop offset="1" stop-color="#578e28"/>
    </radialGradient>
    <linearGradient id="snoutKing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bee45e"/>
      <stop offset="1" stop-color="#7fbb39"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b93b3c"/>
      <stop offset="1" stop-color="#76262d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff092"/>
      <stop offset=".28" stop-color="#ffd552"/>
      <stop offset=".66" stop-color="#e2a622"/>
      <stop offset="1" stop-color="#b77b10"/>
    </linearGradient>
  </defs>

  <g stroke="#2b2918" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- royal cape -->
    <path d="M45 132c-21 27-25 63-15 94 24-19 53-24 90-24s66 5 90 24c10-31 6-67-15-94z" fill="url(#cape)"/>
    <path d="M48 135c-10 26-11 54-4 76" fill="none" stroke="#e0aa49" stroke-width="4" opacity=".55"/>
    <path d="M192 135c10 26 11 54 4 76" fill="none" stroke="#e0aa49" stroke-width="4" opacity=".55"/>

    <!-- feet -->
    <path d="M74 201c-3 15 3 23 19 24 14 1 21-7 21-22z" fill="#70ad32"/>
    <path d="M166 201c3 15-3 23-19 24-14 1-21-7-21-22z" fill="#70ad32"/>

    <!-- ears -->
    <path d="M65 89C44 65 49 42 72 51c15 6 25 17 29 29z" fill="#89c743"/>
    <path d="M175 89c21-24 16-47-7-38-15 6-25 17-29 29z" fill="#89c743"/>
    <path d="M67 82c-11-15-9-27 2-26 10 1 18 10 22 19z" fill="#5e9b27" stroke="none"/>
    <path d="M173 82c11-15 9-27-2-26-10 1-18 10-22 19z" fill="#5e9b27" stroke="none"/>

    <!-- body -->
    <ellipse cx="120" cy="145" rx="89" ry="82" fill="url(#pigKingBody)"/>
    <ellipse cx="120" cy="174" rx="58" ry="39" fill="#d4f08a" opacity=".18" stroke="none"/>

    <!-- eyes, half-lidded and unbothered -->
    <ellipse cx="87" cy="119" rx="20" ry="21" fill="#fffdf2"/>
    <ellipse cx="153" cy="119" rx="20" ry="21" fill="#fffdf2"/>
    <path d="M66 111c12-10 30-8 41 0-2-12-9-18-21-18-11 0-18 6-20 18z" fill="#83bb3c"/>
    <path d="M174 111c-12-10-30-8-41 0 2-12 9-18 21-18 11 0 18 6 20 18z" fill="#83bb3c"/>
    <ellipse cx="91" cy="123" rx="7" ry="10" fill="#242013" stroke="none"/>
    <ellipse cx="149" cy="123" rx="7" ry="10" fill="#242013" stroke="none"/>
    <circle cx="94" cy="119" r="2.6" fill="#fffdf4" stroke="none"/>
    <circle cx="152" cy="119" r="2.6" fill="#fffdf4" stroke="none"/>

    <!-- cheeks -->
    <ellipse cx="55" cy="155" rx="14" ry="8" fill="#ef8d68" opacity=".32" stroke="none"/>
    <ellipse cx="185" cy="155" rx="14" ry="8" fill="#ef8d68" opacity=".32" stroke="none"/>

    <!-- snout -->
    <ellipse cx="120" cy="157" rx="45" ry="31" fill="url(#snoutKing)"/>
    <ellipse cx="104" cy="157" rx="6" ry="8" fill="#557a21" stroke="none"/>
    <ellipse cx="136" cy="157" rx="6" ry="8" fill="#557a21" stroke="none"/>

    <!-- supremely smug smile -->
    <path d="M87 191c17 13 48 13 67-1" fill="none" stroke="#4b6d20" stroke-width="5"/>
    <path d="M94 193c3 6 9 9 15 10" fill="none" stroke="#f6f4d9" stroke-width="4"/>
    <path d="M154 189c7 1 12 4 15 8" fill="none" stroke="#4b6d20" stroke-width="4"/>

    <!-- golden collar -->
    <path d="M44 148c17 18 42 26 76 26s59-8 76-26" fill="none" stroke="#2b2918" stroke-width="18"/>
    <path d="M44 148c17 18 42 26 76 26s59-8 76-26" fill="none" stroke="url(#gold)" stroke-width="11"/>
    <circle cx="120" cy="176" r="11" fill="url(#gold)"/>
    <circle cx="120" cy="176" r="4.5" fill="#b73838" stroke="none"/>

    <!-- crown -->
    <g>
      <path d="M60 66l10-39 20 19 15-31 16 31 21-20 8 40z" fill="url(#gold)"/>
      <path d="M63 64h94l-4 22H66z" fill="url(#gold)"/>
      <path d="M69 70h82" fill="none" stroke="#fff1a1" stroke-width="4" opacity=".62"/>
      <circle cx="70" cy="30" r="7" fill="#d84a3d"/>
      <circle cx="111" cy="21" r="7.5" fill="#4b9bd0"/>
      <circle cx="154" cy="30" r="7" fill="#d84a3d"/>
      <circle cx="95" cy="76" r="4" fill="#4b9bd0"/>
      <circle cx="120" cy="76" r="4.5" fill="#d84a3d"/>
      <circle cx="145" cy="76" r="4" fill="#4b9bd0"/>
      <path d="M70 49c8-4 17-6 26-4" fill="none" stroke="#fff8c4" stroke-width="3" opacity=".55"/>
    </g>

    <!-- tiny royal beauty mark -->
    <circle cx="164" cy="170" r="3.8" fill="#4d7020" stroke="none"/>
  </g>
</svg>
